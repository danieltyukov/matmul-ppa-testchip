name: lint

# Verilator --lint-only -Wall on the chip, on the verification harness and on the
# candidate skeleton a fork starts from. Zero warnings is the pass condition, not zero
# errors. Also the style and documentation link checks, which are cheap and catch the
# most visible kind of rot.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verilator:
    # Ubuntu 24.04 ships Verilator 5.020, which is the version this repository is
    # developed against. Pinning the runner image rather than using ubuntu-latest
    # keeps the lint result reproducible when GitHub moves the label.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends verilator
          verilator --version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint the chip and the harness
        run: make lint

      - name: Lint the candidate skeleton
        # engine_template.sv is what a fork copies to add its own candidate. It is not
        # in rtl/filelist.f, so nothing else would catch it going stale.
        run: make lint-template

      - name: Style and documentation links
        # Line length, trailing whitespace, final newlines, and every relative link and
        # image in the markdown.
        run: make style
